let celebrationInitialized=false,lastCelebratedRound=-1;
function celebrateRound(roundIndex){

 const best=Math.max(...ps.map(([id])=>Number(r.scores[id]||0)));
 const names=ps.filter(([id])=>Number(r.scores[id]||0)===best).map(([,p])=>p.name);
 const layer=document.createElement('div');layer.className='celebration';layer.setAttribute('role','status');
 const banner=document.createElement('div');banner.className='celebration-banner';
 banner.textContent='🎉 Round '+(roundIndex+1)+' winner'+(names.length>1?'s':'')+': '+names.join(' & ')+'! 🏆';
 layer.appendChild(banner);
 if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  const colors=['#e8b65b','#ff858b','#9ae4bb','#83cfff','#d9a7ff'];
  for(let i=0;i<95;i++){let piece=document.createElement('span');piece.className='confetti-piece';piece.style.left=Math.random()*100+'%';piece.style.background=colors[i%colors.length];piece.style.animationDelay=Math.random()*.9+'s';piece.style.setProperty('--drift',(Math.random()*240-120)+'px');layer.appendChild(piece)}
 }

}
function checkRoundCelebration(){

 if(scored===undefined)return;
 if(!celebrationInitialized){celebrationInitialized=true;lastCelebratedRound=scored;return}
 if(scored>lastCelebratedRound){lastCelebratedRound=scored;const r=game.rounds[scored],best=Math.max(...players().map(([id])=>Number(r.scores?.[id]||0)));if(me()&&Number(r.scores?.[uid]||0)===best)celebrateRound(scored)}
}
function updateBidValidation(){let button=$('#lockBid');if(!button)return;button.disabled=!document.querySelector('input[name="bidValue"]:checked');}
function history(){let rows=Object.entries(game.rounds||{}).filter(([,r])=>r.scores).sort((a,b)=>Number(b[0])-Number(a[0]));return panel('<h2>Round history</h2>'+(rows.length?rows.map(([i,r])=>'<details><summary>Round '+(Number(i)+1)+' · '+rounds[i]+' cards · '+(Number(i)<=5?(r.trump||'Trump'):'No trump')+'</summary>'+players().map(([id,p])=>'<div class="cardline">'+esc(p.name)+': bid '+r.bids?.[id]?.value+(r.bids?.[id]?.blind?' blind':'')+', won '+r.tricks?.[id]+', <b>+'+(r.scores?.[id]||0)+'</b></div>').join('')+'</details>').join(''):'<p class="muted">Completed rounds appear here.</p>')+(host()&&rows.length?btn('Undo last round','undo','secondary'):''));
}
async function connect(room){if(unsub)unsub();code=room;celebrationInitialized=false;lastCelebratedRound=-1;unsub=onValue(ref(db,'games/'+room),snap=>{game=snap.val();if(game)checkRoundCelebration();if(!game){msg('Room no longer exists.',true);localStorage.removeItem('riverSession')}else{localStorage.setItem('riverSession',JSON.stringify({code:room}));msg('Connected · Live sync enabled')}render()},e=>{msg(e.message,true);appEl.innerHTML=panel('<h2>Connection problem</h2><p>'+esc(e.message)+'</p>')})}
async function act(action){try{
if(action==='create'){let name=$('#createName').value.trim();if(!name)throw Error('Enter your name.');let c=key();await set(ref(db,'games/'+c),{hostUid:uid,phase:'lobby',roundIndex:0,createdAt:Date.now(),players:{[uid]:{name,seat:0}}});await connect(c)}
if(action==='joinInvite'){let name=$('#inviteName').value.trim();if(!name)throw Error('Enter your name.');let seat=Math.max(-1,...players().map(([,p])=>p.seat))+1;await set(ref(db,'games/'+code+'/players/'+uid),{name,seat})}
if(action==='join'){let c=$('#joinCode').value.trim().toUpperCase(),name=$('#joinName').value.trim();if(!name||c.length!==6)throw Error('Enter your name and six-character room code.');let g=(await get(ref(db,'games/'+c))).val();if(!g)throw Error('Room not found.');if(!g.players?.[uid]){if(g.phase!=='lobby')throw Error('This game is in progress, but this browser is not recognized as an existing player. Reopen it using the same browser or Home Screen app you originally joined with.');let seat=Math.max(-1,...Object.values(g.players||{}).map(p=>p.seat))+1;await set(ref(db,'games/'+c+'/players/'+uid),{name,seat})}await connect(c)}
if(action==='requestReconnect'){let playerId=$('#reconnectPlayer')?.value;if(!playerId||!game.players?.[playerId]||isTest(playerId))throw Error('Select an existing player.');await set(ref(db,'games/'+code+'/reconnectRequests/'+uid),{playerId,requestedAt:Date.now()});msg('Request sent. Ask the host to approve it.');}
if(action.startsWith('declineReconnect:')){if(!host())return;let id=action.split(':')[1];await set(ref(db,'games/'+code+'/reconnectRequests/'+id),null)}
if(action.startsWith('approveReconnect:')){if(!host())return;let id=action.split(':')[1],req=game.reconnectRequests?.[id],old=req?.playerId;if(!req||!game.players?.[old]||isTest(old))throw Error('Reconnect request no longer valid.');if(game.players[id])throw Error('This device already has a player.');let changes={['players/'+id]:game.players[old],['players/'+old]:null,['reconnectRequests/'+id]:null};if(game.hostUid===old)changes.hostUid=id;for(let [roundId,round] of Object.entries(game.rounds||{})){for(let field of ['bids','tricks','scores'])if(round[field]&&Object.prototype.hasOwnProperty.call(round[field],old)){changes['rounds/'+roundId+'/'+field+'/'+id]=round[field][old];changes['rounds/'+roundId+'/'+field+'/'+old]=null}}await update(ref(db,'games/'+code),changes);msg('Player reconnected successfully.')}
if(action==='addTest'){if(!host()||phase()!=='lobby')throw Error('Only the host can add test players before starting.');let name=$('#testName').value.trim()||'Test Player '+players().length;let seat=Math.max(-1,...players().map(([,p])=>p.seat))+1;await set(ref(db,'games/'+code+'/players/test_'+seat),{name,seat})}
if(action.startsWith('seatUp:')||action.startsWith('seatDown:')){if(!host()||phase()!=='lobby')return;let id=action.split(':')[1],a=players(),i=a.findIndex(([pid])=>pid===id),j=i+(action.startsWith('seatUp:')?-1:1);if(j>=0&&j<a.length){let changes={};a.splice(i,1);let [item]=players().filter(([pid])=>pid===id);a.splice(j,0,item);a.forEach(([pid],k)=>changes['players/'+pid+'/seat']=k);await update(ref(db,'games/'+code),changes)}}
if(action==='removeTest'){if(!host()||phase()!=='lobby')return;let changes={};for(let [id] of players())if(isTest(id))changes['players/'+id]=null;await update(ref(db,'games/'+code),changes)}
if(action==='profileOut'){localStorage.removeItem(ACTIVE_KEY);render();return}
if(action==='leave'){localStorage.removeItem('riverSession');if(unsub)unsub();game=null;code=null;render()}
if(action==='copy'){await navigator.clipboard.writeText(location.href.split('?')[0]+'?room='+code);msg('Invite link copied.')}
if(action==='start'){if(!host()||!ready())throw Error('At least two players are required.');await update(ref(db,'games/'+code),{phase:'trump',roundIndex:0})}
if(action==='trump'){if(!host())return;await update(ref(db,'games/'+code),{['rounds/'+game.roundIndex+'/trump']:document.querySelector('input[name="trump"]:checked').value,phase:'bidding'})}
if(action==='bid'){let selected=document.querySelector('input[name="bidValue"]:checked');if(!selected)throw Error('Select a bid first.');let v=Number(selected.value),r=current(),o=order(),next=o.find(([id])=>!r.bids?.[id]);if(!next||!canBid(next[0]))throw Error('Not your turn.');if(!Number.isInteger(v)||v<0||v>rounds[game.roundIndex])throw Error('Invalid bid.');let existing=r.bids||{},sum=Object.values(existing).reduce((n,b)=>n+b.value,0);if(next[0]===dealer()&&sum+v===rounds[game.roundIndex])throw Error("Brian's Rule: the dealer cannot make total bids equal available tricks.");await set(ref(db,'games/'+code+'/rounds/'+game.roundIndex+'/bids/'+next[0]),{value:v,blind:$('#blind').checked});}
if(action==='fixBid'){if(!host())return;let player=document.querySelector('input[name="fixPlayer"]:checked');if(!player)throw Error('Select a player.');let id=player.value,selected=document.querySelector('input[name="fixBidValue"]:checked');if(!selected)throw Error('Select a corrected bid.');let v=Number(selected.value),b=current().bids||{};if(!b[id])throw Error('Player has not bid yet.');if(!Number.isInteger(v)||v<0||v>rounds[game.roundIndex])throw Error('Invalid correction.');let sum=Object.entries(b).reduce((n,[k,x])=>n+(k===id?v:x.value),0);if(Object.keys(b).length===players().length&&sum===rounds[game.roundIndex])throw Error("Brian's Rule: combined bids cannot equal tricks.");await set(ref(db,'games/'+code+'/rounds/'+game.roundIndex+'/bids/'+id),{value:v,blind:$('#fixBlind').checked})}
if(action==='toTricks'){if(!host()||Object.keys(current().bids||{}).length!==players().length)throw Error('All players must bid.');await update(ref(db,'games/'+code),{phase:'tricks'})}
if(action==='backBids'){if(host())await update(ref(db,'games/'+code),{phase:'bidding'})}
if(action.startsWith('setTricks:')){let id=action.split(':')[1];if(phase()!=='tricks'||!(host()||id===uid))throw Error('You cannot edit these tricks.');let n=Number(action.split(':')[2]),limit=rounds[game.roundIndex];if(!Number.isInteger(n)||n<0||n>limit)throw Error('Invalid trick count.');await set(ref(db,'games/'+code+'/rounds/'+game.roundIndex+'/tricks/'+id),n)}
if(action==='finishRound'){if(!host())return;let limit=rounds[game.roundIndex],t=current().tricks||{};if(!tricksComplete()||trickTotal()!==limit)throw Error('Every player must enter tricks and the total must equal '+limit+'. Currently '+trickTotal()+'.');let s={};for(let [id] of players()){let b=current().bids[id];s[id]=t[id]===b.value?(b.blind?15:10)+b.value:t[id]}let path='rounds/'+game.roundIndex;let changes={[path+'/scores']:s};if(game.roundIndex===10){changes.phase='finished'}else{changes.roundIndex=game.roundIndex+1;changes.phase=game.roundIndex+1<=5?'trump':'bidding'}await update(ref(db,'games/'+code),changes)}

if(action==='undo'){if(!host())return;let n=game.phase==='finished'?10:game.roundIndex-1;if(n<0)throw Error('Nothing to undo.');if(!confirm('Reopen round '+(n+1)+' for host corrections?'))return;await update(ref(db,'games/'+code),{roundIndex:n,phase:'tricks'})}
if(action==='restart'){if(!host()||!confirm('Start a fresh game with the same players?'))return;await update(ref(db,'games/'+code),{rounds:null,roundIndex:0,phase:'trump'})}
}catch(e){msg(e.message||String(e),true)}}
document.addEventListener('change',e=>{if(e.target.name==='bidValue')updateBidValidation();if(e.target.dataset.trick)act('setTricks:'+e.target.dataset.trick+':'+e.target.value)});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)act(b.dataset.action)});
if(!cfg?.apiKey||!cfg?.databaseURL){msg('Setup needed: add your Firebase configuration to config.js.',true);appEl.innerHTML=panel('<h2>Cloud setup required</h2><p>See the repository README for one-time Firebase setup. This enables every family member to use their own phone with live updates.</p>')}else{try{let fb=initializeApp(cfg);db=getDatabase(fb);auth=getAuth(fb);onAuthStateChanged(auth,u=>{if(u){uid=u.uid;let room=new URLSearchParams(location.search).get('room')||saved.code;if(room)connect(room.toUpperCase()).catch(e=>{msg(e.message,true);appEl.innerHTML=panel('<h2>Unable to reconnect</h2><p>'+esc(e.message)+'</p>')});else render()}});signInAnonymously(auth).catch(e=>{msg('Sign-in failed: '+e.message,true);appEl.innerHTML=panel('<h2>Unable to connect</h2><p>'+esc(e.message)+'</p>')})}catch(e){msg(e.message,true);appEl.innerHTML=panel('<h2>Unable to start game</h2><p>'+esc(e.message)+'</p>')}}
</script></body></html>
